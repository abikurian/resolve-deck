<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resolve Deck</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            background: #0d0f12;
            color: #e1e7ec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: #171b21;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282f3a;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            display: inline-block;
        }

        .status-dot.connected {
            background: #10b981;
        }

        /* Top: Video Stream & Scopes */
        #monitor-panel {
            width: 100%;
            height: 38%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #282f3a;
        }

        #monitor-panel img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Bottom: Control Surface */
        #controls {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            padding: 12px;
            gap: 12px;
        }

        /* Jog Wheel Styling */
        .jog-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #jog-wheel {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle, #252b36 30%, #15181f 90%);
            border: 4px solid #3b4455;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #jog-indicator {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #38bdf8;
            position: absolute;
            top: 14px;
            box-shadow: 0 0 10px #38bdf8;
        }

        .transport-bar {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #252b36;
            color: #fff;
            border: 1px solid #475569;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* Color Wheels Section */
        .wheels-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            align-items: center;
        }

        .wheel-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .color-pad {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: radial-gradient(circle, #222731 0%, #12141a 100%);
            border: 2px solid #334155;
            position: relative;
        }

        .puck {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>

<body>

    <header>
        <span style="font-weight: 700;">DAVINCI REMOTE DECK</span>
        <div><span id="dot" class="status-dot"></span></div>
    </header>

    <!-- Live Scope / Preview Feed -->
    <div id="monitor-panel">
        <img id="stream-img" src="/stream" alt="Resolve Preview / Scopes">
    </div>

    <!-- Physical Deck Emulation -->
    <div id="controls">
        <!-- Jog / Shuttle -->
        <div class="jog-container">
            <div id="jog-wheel">
                <div id="jog-indicator"></div>
            </div>
            <div class="transport-bar">
                <button class="btn" onclick="sendAction('play_pause')">PLAY</button>
                <button class="btn" style="background:#dc2626;" onclick="sendAction('cut')">SPLIT</button>
            </div>
        </div>

        <!-- 3-Way Color Wheels -->
        <div class="wheels-container">
            <div class="wheel-card">
                <span class="wheel-label">Lift</span>
                <div class="color-pad" id="wheel-lift">
                    <div class="puck" id="puck-lift"></div>
                </div>
            </div>
            <div class="wheel-card">
                <span class="wheel-label">Gamma</span>
                <div class="color-pad" id="wheel-gamma">
                    <div class="puck" id="puck-gamma"></div>
                </div>
            </div>
            <div class="wheel-card">
                <span class="wheel-label">Gain</span>
                <div class="color-pad" id="wheel-gain">
                    <div class="puck" id="puck-gain"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // WEBSOCKET HANDSHAKE
        // -------------------------------------------------------------
        const dot = document.getElementById("dot");
        let ws;
        function connect() {
            ws = new WebSocket(`ws://${location.host}/ws`);
            ws.onopen = () => dot.classList.add("connected");
            ws.onclose = () => {
                dot.classList.remove("connected");
                setTimeout(connect, 2000);
            };
        }
        connect();

        function send(msg) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(msg));
            }
        }

        function sendAction(act) {
            if (navigator.vibrate) navigator.vibrate(20);
            send({ action: act });
        }

        // -------------------------------------------------------------
        // JOG WHEEL LOGIC
        // -------------------------------------------------------------
        const jog = document.getElementById("jog-wheel");
        const indicator = document.getElementById("jog-indicator");
        let prevAngle = null;
        let rotation = 0;

        function getAngle(touch, el) {
            const rect = el.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            return Math.atan2(touch.clientY - cy, touch.clientX - cx) * (180 / Math.PI);
        }

        jog.addEventListener("touchstart", (e) => {
            prevAngle = getAngle(e.touches[0], jog);
        });

        jog.addEventListener("touchmove", (e) => {
            if (prevAngle === null) return;
            const curAngle = getAngle(e.touches[0], jog);
            let delta = curAngle - prevAngle;

            // Handle crossing the 180 / -180 boundary
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;

            rotation += delta;
            indicator.style.transform = `rotate(${rotation}deg)`;
            indicator.style.transformOrigin = `50% 70px`;

            // Trigger frame step every 15 degrees of rotation
            if (Math.abs(delta) > 12) {
                const step = delta > 0 ? 1 : -1;
                send({ action: "jog", delta: step });
                if (navigator.vibrate) navigator.vibrate(10);
                prevAngle = curAngle;
            }
        });

        jog.addEventListener("touchend", () => { prevAngle = null; });

        // -------------------------------------------------------------
        // COLOR WHEEL PUCK TRACKING
        // -------------------------------------------------------------
        ["lift", "gamma", "gain"].forEach(name => {
            const pad = document.getElementById(`wheel-${name}`);
            const puck = document.getElementById(`puck-${name}`);

            pad.addEventListener("touchmove", (e) => {
                const touch = e.touches[0];
                const rect = pad.getBoundingClientRect();
                const r = rect.width / 2;
                const dx = touch.clientX - (rect.left + r);
                const dy = touch.clientY - (rect.top + r);

                // Clamping to circular radius
                const dist = Math.min(Math.sqrt(dx * dx + dy * dy), r);
                const angle = Math.atan2(dy, dx);
                const clampX = Math.cos(angle) * dist;
                const clampY = Math.sin(angle) * dist;

                puck.style.transform = `translate(calc(-50% + ${clampX}px), calc(-50% + ${clampY}px))`;

                // Send normalized vector (-1.0 to 1.0)
                send({
                    action: "color",
                    wheel: name,
                    dx: clampX / r,
                    dy: clampY / r
                });
            });

            pad.addEventListener("touchend", () => {
                // Return puck to dead center
                puck.style.transform = `translate(-50%, -50%)`;
                send({ action: "color", wheel: name, dx: 0, dy: 0 });
            });
        });
    </script>
</body>

</html>
