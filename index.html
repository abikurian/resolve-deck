<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DaVinci Resolve Deck</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            margin: 0;
            background: #4a4c52;
            color: #e1e7ec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-bottom: 20px;
            box-sizing: border-box;
        }

        header {
            background: #2b2d31;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #202225;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .header-title {
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 0.8px;
            color: #e2e8f0;
            text-transform: uppercase;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            display: inline-block;
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
        }

        .status-dot.connected {
            background: #10b981;
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.8);
        }

        #custom-deck {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            background: radial-gradient(circle at 50% 20%, #52545c 0%, #44464c 100%);
            box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.4);
            overflow-y: auto;
        }

        /* Mechanical Tactile Keycap Design */
        .key {
            border-radius: 4px;
            box-shadow: 0 4px 0 #1e2024, 0 5px 10px rgba(0, 0, 0, 0.5);
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.05s, box-shadow 0.05s;
            padding: 8px 6px;
            min-height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            outline: none;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }

        .key:active,
        .key.active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1e2024, 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* Color Variants */
        .key-dark {
            background: #35383d;
            color: #9ca3af;
        }

        .key-red {
            background: #8b2629;
            color: #f87171;
            box-shadow: 0 4px 0 #581618, 0 5px 10px rgba(0, 0, 0, 0.5);
        }

        .key-red:active,
        .key-red.active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #581618, 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* Blackmagic Jog Wheel */
        #jog-wheel {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #171717;
            border: 4px solid #282a2e;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75), inset 0 2px 4px rgba(255, 255, 255, 0.08);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            cursor: grab;
        }

        #jog-wheel:active {
            cursor: grabbing;
        }

        #jog-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #121315;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7), 0 1px 1px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.6);
            position: absolute;
            top: 14px;
            left: calc(50% - 10px);
            pointer-events: none;
        }

        /* High-Sensitivity Top Trackpad Surface */
        #trackpad {
            height: 40vh;
            min-height: 250px;
            width: 100%;
            border-radius: 12px;
            margin-bottom: 15px;
            background: #1a1c20;
            border: 1px solid #35383d;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #9ca3af;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            touch-action: none;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
            transition: border-color 0.15s, background-color 0.15s;
        }

        #trackpad:active {
            background: #1e2025;
            border-color: #4f535a;
        }

        @media (max-width: 600px) {
            .key {
                font-size: 9px;
                padding: 6px 2px;
            }
        }
    </style>
</head>

<body>

    <header>
        <span class="header-title">DaVinci Resolve Deck</span>
        <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 10px; color: #9ca3af; text-transform: uppercase; font-weight: 700;">Deck</span>
            <span id="dot" class="status-dot"></span>
        </div>
    </header>

    <!-- Top Trackpad Surface -->
    <div id="trackpad">TRACKPAD (TAP TO CLICK)</div>

    <!-- Advanced Custom Deck -->
    <div id="custom-deck">
        <!-- Page Navigation Row -->
        <div class="page-nav" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="key key-dark" style="min-height: 48px; font-size: 12px; font-weight: 800;" onclick="sendAction('page_edit')">EDIT PAGE</button>
            <button class="key key-dark" style="min-height: 48px; font-size: 12px; font-weight: 800;" onclick="sendAction('page_color')">COLOR PAGE</button>
        </div>

        <!-- Row: Edit Tools & Zoom -->
        <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;">
            <button class="key key-dark" onclick="sendAction('tool_arrow')">ARROW</button>
            <button class="key key-dark" onclick="sendAction('tool_blade')">BLADE</button>
            <button class="key key-dark" onclick="sendAction('snapping')">SNAP</button>
            <button class="key key-dark" onclick="sendAction('zoom_in')">ZOOM +</button>
            <button class="key key-dark" onclick="sendAction('zoom_out')">ZOOM -</button>
        </div>

        <!-- Row: Timeline Workflow & Cinema Viewer -->
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
            <button class="key key-dark" onclick="sendAction('fullscreen')">FULL SCREEN</button>
            <button class="key key-dark" onclick="sendAction('zoom_fit')">FIT ZOOM</button>
            <button class="key key-dark" onclick="sendAction('marker')">MARKER</button>
        </div>

        <!-- Row 1: Nodes & View -->
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
            <button class="key key-dark" onclick="sendAction('add_serial')">SERIAL NODE</button>
            <button class="key key-dark" onclick="sendAction('add_parallel')">PARL NODE</button>
            <button class="key key-dark" onclick="sendAction('bypass_color')">BYPASS FX</button>
            <button class="key key-dark" onclick="sendAction('disable_clip')">DISABLE</button>
        </div>

        <!-- Row 2: Timeline Navigation & Escape -->
        <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;">
            <button class="key key-dark" onclick="sendAction('esc')">ESC</button>
            <button class="key key-dark" onclick="sendAction('undo')">UNDO</button>
            <button class="key key-dark" onclick="sendAction('redo')">REDO</button>
            <button class="key key-dark" onclick="sendAction('prev_clip')">PREV CLIP</button>
            <button class="key key-dark" onclick="sendAction('next_clip')">NEXT CLIP</button>
        </div>

        <!-- Row 3: Trimming & Marking -->
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
            <button class="key key-dark" onclick="sendAction('mark_in')">MARK IN</button>
            <button class="key key-dark" onclick="sendAction('mark_out')">MARK OUT</button>
            <button class="key key-red" onclick="sendAction('cut')">SPLIT</button>
            <button class="key key-red" onclick="sendAction('ripple_del')">RIPPLE DEL</button>
        </div>

        <!-- Row: Clip Move & Save -->
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
            <button class="key key-dark" onclick="sendAction('save')">SAVE</button>
            <button id="btn-jog-mode" class="key key-dark" onclick="toggleJogMode()">JOG: TIMELINE</button>
            <button class="key key-dark" onclick="sendAction('clip_up')">CLIP UP</button>
            <button class="key key-dark" onclick="sendAction('clip_down')">CLIP DOWN</button>
        </div>

        <!-- Row 4: Transport Core -->
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 10px 0;">
            <div id="jog-wheel">
                <div id="jog-indicator"></div>
            </div>
            <button class="key key-dark" style="min-width: 170px; min-height: 52px; font-size: 13px; font-weight: 800;" onclick="sendAction('play_pause')">PLAY / STOP</button>
        </div>
    </div>

    <script>
        let jogMode = 'timeline';

        function toggleJogMode() {
            jogMode = jogMode === 'timeline' ? 'move' : 'timeline';
            document.getElementById('btn-jog-mode').innerText = jogMode === 'timeline' ? 'JOG: TIMELINE' : 'JOG: MOVE CLIP';
            if (navigator.vibrate) navigator.vibrate(15);
        }

        // -------------------------------------------------------------
        // WEBSOCKET HANDSHAKE
        // -------------------------------------------------------------
        const dot = document.getElementById("dot");
        let ws;
        function connect() {
            ws = new WebSocket(`ws://${location.host}/ws`);
            ws.onopen = () => dot.classList.add("connected");
            ws.onclose = () => {
                dot.classList.remove("connected");
                setTimeout(connect, 2000);
            };
        }
        connect();

        function send(msg) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                if (typeof msg === 'string') {
                    ws.send(msg);
                } else {
                    ws.send(JSON.stringify(msg));
                }
            }
        }

        function sendAction(action) {
            if (navigator.vibrate) navigator.vibrate(15);
            send({ action: action });
        }

        // -------------------------------------------------------------
        // TRACKPAD LOGIC
        // -------------------------------------------------------------
        const trackpad = document.getElementById("trackpad");
        let trackpadLastX = 0;
        let trackpadLastY = 0;
        let trackpadTotalDist = 0;
        let trackpadTouchCount = 0;
        let lastMouseTime = 0;

        trackpad.addEventListener("touchstart", (e) => {
            trackpadTouchCount = e.touches.length;
            if (e.touches.length > 0) {
                trackpadLastX = e.touches[0].clientX;
                trackpadLastY = e.touches[0].clientY;
                trackpadTotalDist = 0;
            }
        });

        trackpad.addEventListener("touchmove", (e) => {
            e.preventDefault();
            if (e.touches.length === 2) {
                const curY = e.touches[0].clientY;
                const dy = curY - trackpadLastY;
                trackpadTotalDist += Math.abs(dy);
                trackpadLastY = curY;
                trackpadLastX = e.touches[0].clientX;

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send('scroll:' + dy);
                }
            } else if (e.touches.length === 1) {
                const curX = e.touches[0].clientX;
                const curY = e.touches[0].clientY;
                const dx = curX - trackpadLastX;
                const dy = curY - trackpadLastY;
                trackpadTotalDist += Math.hypot(dx, dy);
                trackpadLastX = curX;
                trackpadLastY = curY;

                if (ws && ws.readyState === WebSocket.OPEN) {
                    let now = Date.now();
                    if (now - lastMouseTime > 12) {
                        ws.send('mouse:' + dx + ',' + dy);
                        lastMouseTime = now;
                    }
                }
            }
        }, { passive: false });

        trackpad.addEventListener("touchend", (e) => {
            if (trackpadTotalDist < 3) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    if (trackpadTouchCount === 2) {
                        ws.send('right_click');
                    } else if (trackpadTouchCount === 3) {
                        ws.send('middle_click');
                    } else {
                        ws.send('click');
                    }
                }
                trackpadTotalDist = 999;
            }
        });

        // -------------------------------------------------------------
        // BLACKMAGIC JOG WHEEL LOGIC
        // -------------------------------------------------------------
        const jog = document.getElementById("jog-wheel");
        const indicator = document.getElementById("jog-indicator");
        let prevAngle = null;
        let lastVisualAngle = null;
        let rotation = 0;

        function getAngle(touch, el) {
            const rect = el.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            return Math.atan2(touch.clientY - cy, touch.clientX - cx) * (180 / Math.PI);
        }

        jog.addEventListener("touchstart", (e) => {
            prevAngle = getAngle(e.touches[0], jog);
            lastVisualAngle = prevAngle;
        });

        jog.addEventListener("touchmove", (e) => {
            if (prevAngle === null) return;
            const curAngle = getAngle(e.touches[0], jog);

            // Smooth visual rotation tracking
            let moveDelta = curAngle - lastVisualAngle;
            if (moveDelta > 180) moveDelta -= 360;
            if (moveDelta < -180) moveDelta += 360;
            lastVisualAngle = curAngle;

            rotation += moveDelta;
            indicator.style.transform = `rotate(${rotation}deg)`;
            indicator.style.transformOrigin = `50% 61px`;

            // Thresholded action dispatch to prevent WebSocket flooding
            let delta = curAngle - prevAngle;
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;

            if (Math.abs(delta) > 5) {
                if (navigator.vibrate) navigator.vibrate(10);
                if (delta > 0) {
                    sendAction(jogMode === 'timeline' ? 'jog_fwd' : 'nudge_right');
                } else {
                    sendAction(jogMode === 'timeline' ? 'jog_rev' : 'nudge_left');
                }
                prevAngle = curAngle;
            }
        });

        jog.addEventListener("touchend", () => {
            prevAngle = null;
            lastVisualAngle = null;
        });
    </script>
</body>

</html>
