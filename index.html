<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DaVinci Resolve Deck</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            margin: 0;
            background: #4a4c52;
            color: #e1e7ec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: #2b2d31;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #202225;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .header-title {
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 0.8px;
            color: #e2e8f0;
            text-transform: uppercase;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            display: inline-block;
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
        }

        .status-dot.connected {
            background: #10b981;
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.8);
        }

        /* Top: Video Stream & Scopes */
        #monitor-panel {
            width: 100%;
            height: 38%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 3px solid #202225;
            flex-shrink: 0;
        }

        #custom-deck {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 15px;
            overflow-y: auto;
            background: radial-gradient(circle at 50% 20%, #52545c 0%, #44464c 100%);
            box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.4);
        }

        /* Mechanical Tactile Keycap Design */
        .key {
            border-radius: 4px;
            box-shadow: 0 4px 0 #1e2024, 0 5px 10px rgba(0, 0, 0, 0.5);
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.05s, box-shadow 0.05s;
            padding: 8px 6px;
            min-height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            outline: none;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }

        .key:active,
        .key.active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1e2024, 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* Color Variants */
        .key-dark {
            background: #35383d;
            color: #9ca3af;
        }

        .key-red {
            background: #8b2629;
            color: #f87171;
            box-shadow: 0 4px 0 #581618, 0 5px 10px rgba(0, 0, 0, 0.5);
        }

        .key-red:active,
        .key-red.active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #581618, 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* Blackmagic Jog Wheel */
        #jog-wheel {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #171717;
            border: 4px solid #282a2e;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75), inset 0 2px 4px rgba(255, 255, 255, 0.08);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            cursor: grab;
        }

        #jog-wheel:active {
            cursor: grabbing;
        }

        #jog-indicator {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #121315;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7), 0 1px 1px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.6);
            position: absolute;
            top: 14px;
            left: calc(50% - 9px);
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .key {
                font-size: 9px;
                padding: 6px 2px;
            }
        }
    </style>
</head>

<body>

    <header>
        <span class="header-title">DaVinci Resolve Deck</span>
        <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 10px; color: #9ca3af; text-transform: uppercase; font-weight: 700;">Live Feed</span>
            <span id="dot" class="status-dot"></span>
        </div>
    </header>

    <!-- Live Scope / Preview Feed -->
    <div id="monitor-panel">
        <img id="stream-img" src="/stream" alt="Resolve Preview / Scopes" style="width: 100%; height: 100%; object-fit: contain;">
    </div>

    <!-- Page Navigation Row -->
    <div class="page-nav" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px 15px 0 15px;">
        <button class="key key-dark" style="min-height: 48px; font-size: 12px; font-weight: 800;" onclick="sendAction('page_edit')">EDIT PAGE</button>
        <button class="key key-dark" style="min-height: 48px; font-size: 12px; font-weight: 800;" onclick="sendAction('page_color')">COLOR PAGE</button>
    </div>

    <!-- Advanced Custom Deck -->
    <div id="custom-deck" style="display: flex; flex-direction: column; gap: 15px; padding: 15px;">
        <!-- Row 1: Nodes & View -->
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
            <button class="key key-dark" onclick="sendAction('add_serial')">SERIAL NODE</button>
            <button class="key key-dark" onclick="sendAction('add_parallel')">PARL NODE</button>
            <button class="key key-dark" onclick="sendAction('bypass_color')">BYPASS FX</button>
            <button class="key key-dark" onclick="sendAction('disable_clip')">DISABLE</button>
        </div>

        <!-- Row 2: Timeline Navigation -->
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
            <button class="key key-dark" onclick="sendAction('undo')">UNDO</button>
            <button class="key key-dark" onclick="sendAction('redo')">REDO</button>
            <button class="key key-dark" onclick="sendAction('prev_clip')">PREV CLIP</button>
            <button class="key key-dark" onclick="sendAction('next_clip')">NEXT CLIP</button>
        </div>

        <!-- Row 3: Trimming & Marking -->
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
            <button class="key key-dark" onclick="sendAction('mark_in')">MARK IN</button>
            <button class="key key-dark" onclick="sendAction('mark_out')">MARK OUT</button>
            <button class="key key-red" onclick="sendAction('cut')">SPLIT</button>
            <button class="key key-red" onclick="sendAction('ripple_del')">RIPPLE DEL</button>
        </div>

        <!-- Row 4: Transport Core -->
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 5px 0;">
            <div id="jog-wheel">
                <div id="jog-indicator"></div>
            </div>
            <button class="key key-dark" style="min-width: 160px; min-height: 50px; font-size: 12px; font-weight: 800;" onclick="sendAction('play_pause')">PLAY / STOP</button>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // WEBSOCKET HANDSHAKE
        // -------------------------------------------------------------
        const dot = document.getElementById("dot");
        let ws;
        function connect() {
            ws = new WebSocket(`ws://${location.host}/ws`);
            ws.onopen = () => dot.classList.add("connected");
            ws.onclose = () => {
                dot.classList.remove("connected");
                setTimeout(connect, 2000);
            };
        }
        connect();

        function send(msg) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(msg));
            }
        }

        function sendAction(act) {
            if (navigator.vibrate) navigator.vibrate(20);
            send({ action: act });
        }

        // -------------------------------------------------------------
        // BLACKMAGIC JOG WHEEL LOGIC
        // -------------------------------------------------------------
        const jog = document.getElementById("jog-wheel");
        const indicator = document.getElementById("jog-indicator");
        let prevAngle = null;
        let rotation = 0;

        function getAngle(touch, el) {
            const rect = el.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            return Math.atan2(touch.clientY - cy, touch.clientX - cx) * (180 / Math.PI);
        }

        jog.addEventListener("touchstart", (e) => {
            prevAngle = getAngle(e.touches[0], jog);
        });

        jog.addEventListener("touchmove", (e) => {
            if (prevAngle === null) return;
            const curAngle = getAngle(e.touches[0], jog);
            let delta = curAngle - prevAngle;

            // Handle crossing the 180 / -180 boundary
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;

            rotation += delta;
            indicator.style.transform = `rotate(${rotation}deg)`;
            indicator.style.transformOrigin = `50% 56px`;

            // Trigger frame step every 12 degrees of rotation
            if (Math.abs(delta) > 12) {
                const step = delta > 0 ? 1 : -1;
                send({ action: "jog", delta: step });
                if (navigator.vibrate) navigator.vibrate(10);
                prevAngle = curAngle;
            }
        });

        jog.addEventListener("touchend", () => { prevAngle = null; });
    </script>
</body>

</html>
